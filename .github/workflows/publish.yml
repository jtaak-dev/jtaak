name: Publish

# Publishes @jtaak/engine and jtaak to npm when a v* tag is pushed. Both
# packages are released together at the same version (the CLI depends on the
# engine's exact version). Uses npm trusted publishing: no npm token is stored
# here; npm checks this workflow's identity, and adds provenance.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No registry-url here: it writes an _authToken=${NODE_AUTH_TOKEN} line
      # into .npmrc, and npm then uses that placeholder instead of exchanging
      # this workflow's OIDC token (403 "OIDC permission denied"). npm's
      # default registry is already registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pack
      - run: pnpm check:install
      - name: Check the tag matches both package versions
        run: |
          engine=$(node -p "require('./packages/engine/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$engine" != "$GITHUB_REF_NAME" ] || [ "v$cli" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match engine $engine and CLI $cli."
            exit 1
          fi
          echo "VERSION=$engine" >> "$GITHUB_ENV"
      # pnpm packs, so the CLI's workspace:* dependency becomes the engine's
      # exact version; npm publishes, since trusted publishing needs npm 11.5.1+.
      - run: npm install -g npm@latest
      # pnpm pack runs in each package folder: with --filter it becomes a
      # recursive command, which pnpm 9's pack doesn't support.
      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          (cd packages/engine && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          (cd packages/cli && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          ls -l "$GITHUB_WORKSPACE/tarballs"
      # The engine first: the CLI depends on it. Each step skips a version
      # that's already on npm, so a run that failed after publishing the engine
      # can simply be run again. The ./ matters: without it, npm reads
      # tarballs/<file> as a GitHub user/repo and refuses it.
      - name: Publish @jtaak/engine
        run: |
          if npm view "@jtaak/engine@$VERSION" version > /dev/null 2>&1; then
            echo "@jtaak/engine@$VERSION is already published; skipping."
          else
            npm publish "./tarballs/jtaak-engine-$VERSION.tgz" --access public
          fi
      - name: Publish jtaak
        run: |
          if npm view "jtaak@$VERSION" version > /dev/null 2>&1; then
            echo "jtaak@$VERSION is already published; skipping."
          else
            npm publish "./tarballs/jtaak-$VERSION.tgz" --access public
          fi
